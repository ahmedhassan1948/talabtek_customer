name: Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs
      
      - name: Analyze
        run: flutter analyze
      
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

  unit_tests:
    name: Unit & Widget Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs
      
      - name: Run tests with coverage
        run: flutter test --coverage --reporter=github
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  integration_tests_android:
    name: Integration Tests (Android)
    runs-on: ubuntu-latest
    needs: [analyze, unit_tests]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
      
      - name: Create emulator
        run: |
          echo "no" | avdmanager create avd -n test -k "system-images;api-34;default;arm64" --force
          emulator -avd test -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect &
      
      - name: Wait for emulator
        run: |
          adb wait-for-device shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 1; done'
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Run integration tests
        run: flutter test integration_test/app_flow_test.dart -d emulator

  integration_tests_ios:
    name: Integration Tests (iOS)
    runs-on: macos-latest
    needs: [analyze, unit_tests]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Install Pods
        run: cd ios && pod install --repo-update
      
      - name: Create simulator
        run: |
          xcrun simctl create "iPhone 15 Test" "iPhone 15" "iOS 17.0"
          xcrun simctl boot "iPhone 15 Test"
      
      - name: Run integration tests
        run: flutter test integration_test/app_flow_test.dart -d "iPhone 15 Test"

  build_android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: [analyze, unit_tests]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Build APK
        run: flutter build apk --release --split-per-abi
      
      - name: Build App Bundle
        run: flutter build appbundle --release
      
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          retention-days: 30

  build_ios:
    name: Build iOS
    runs-on: macos-latest
    needs: [analyze, unit_tests]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Install Pods
        run: cd ios && pod install --repo-update
      
      - name: Build iOS
        run: flutter build ios --release --no-codesign
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build/ios/Runner.ipa
          retention-days: 30

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [analyze, unit_tests, integration_tests_android, integration_tests_ios, build_android, build_ios]
    if: always()
    steps:
      - name: Send notification
        if: failure()
        run: |
          echo "Some jobs failed. Check GitHub Actions for details."
          # Add Slack/Discord/Email notification here
        shell: bash