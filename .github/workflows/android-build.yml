name: Build Android AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: talabtek_app

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Check Flutter project
        run: |
          pwd
          ls -la
          test -f pubspec.yaml
          echo "pubspec.yaml found successfully"

      - name: Get dependencies
        run: flutter pub get

      - name: Verify Android SDK settings
        run: |
          echo "===== Android SDK settings ====="
          grep -Rni "targetSdk" android
          grep -Rni "compileSdk" android

      - name: Build Android App Bundle
        run: flutter build appbundle --release

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: talabtek-customer-aab
          path: talabtek_app/build/app/outputs/bundle/release/app-release.aab
