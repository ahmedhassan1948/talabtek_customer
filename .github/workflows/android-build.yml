name: Build Android App Bundle

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Android App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: talabtek_app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          cache: true

      # ملف Firebase من الـ Secrets (GOOGLE_SERVICES_JSON)
      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then echo "::error::أضف السر GOOGLE_SERVICES_JSON في Settings > Secrets > Actions"; exit 1; fi
          echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      # مفتاح التوقيع من الـ Secrets (اختياري؛ بدونه يُوقَّع بمفتاح debug)
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks; echo "KEYSTORE_FILE=upload-keystore.jks" >> $GITHUB_ENV; fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build App Bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build appbundle --release --obfuscate --split-debug-info=build/app/outputs/symbols

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: talabtek_app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
