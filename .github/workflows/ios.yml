name: iOS Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build and Sign iOS
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
      CERTIFICATE_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
      CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
      PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate signing secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in TEAM_ID BUNDLE_ID CERTIFICATE_BASE64 CERTIFICATE_PASSWORD PROFILE_BASE64 KEYCHAIN_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub secret for $name"
              exit 1
            fi
          done

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Get dependencies
        working-directory: talabtek_app
        run: flutter pub get

      - name: Patch Firebase headers
        working-directory: talabtek_app
        run: python3 tool/patch_firebase_headers.py

      - name: Install CocoaPods
        working-directory: talabtek_app/ios
        run: pod install --repo-update

      - name: Patch gRPC template compatibility
        working-directory: talabtek_app/ios
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path("Pods/gRPC-C++/src/core/lib/promise/detail/basic_seq.h"),
              Path("Pods/gRPC-Core/src/core/lib/promise/detail/basic_seq.h"),
          ]
          old = "Traits::template CallSeqFactory("
          new = "Traits::CallSeqFactory("
          found = 0

          for path in paths:
              if not path.is_file():
                  continue
              found += 1
              text = path.read_text()
              if old in text:
                  path.write_text(text.replace(old, new))
                  print(f"Patched {path}")
              elif new in text:
                  print(f"Already patched {path}")
              else:
                  raise SystemExit(f"Unexpected gRPC header contents: {path}")

          if found == 0:
              print("No matching gRPC header found; continuing.")
          PY

      - name: Install Apple signing certificate and profile
        shell: bash
        working-directory: talabtek_app
        run: |
          set -euo pipefail

          CERT_PATH="$RUNNER_TEMP/distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"

          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")
          PROFILE_TEAM=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")

          python3 - "$RUNNER_TEMP/profile.plist" "$BUNDLE_ID" <<'PY'
          import fnmatch, plistlib, sys
          path, bundle = sys.argv[1:]
          with open(path, "rb") as f:
              p = plistlib.load(f)
          app_id = p.get("Entitlements", {}).get("application-identifier", "")
          expected = f"{p.get('TeamIdentifier', [''])[0]}.{bundle}"
          if not app_id or not fnmatch.fnmatchcase(expected, app_id):
              raise SystemExit(f"Provisioning profile App ID mismatch: {app_id!r}; expected {expected!r}")
          if not p.get("ProvisionedDevices") is None:
              raise SystemExit("Profile is for development/ad hoc distribution, not App Store distribution.")
          if not p.get("ProvisionsAllDevices") and p.get("Entitlements", {}).get("get-task-allow", True):
              raise SystemExit("Profile is not an App Store distribution profile.")
          print("Provisioning profile App ID verified.")
          PY

          if [ "$PROFILE_TEAM" != "$TEAM_ID" ]; then
            echo "::error::Profile Team ID does not match APPLE_TEAM_ID"
            exit 1
          fi

          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          {
            echo "PROFILE_UUID=$PROFILE_UUID"
            echo "PROFILE_NAME=$PROFILE_NAME"
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"
          } >> "$GITHUB_ENV"

      - name: Build Flutter iOS app
        working-directory: talabtek_app
        run: |
          flutter build ios --release --no-codesign \
            --build-name=1.0.0 \
            --build-number=${{ github.run_number }}

      - name: Archive signed iOS app
        working-directory: talabtek_app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/ios/Runner.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive

      - name: Create App Store export options
        working-directory: talabtek_app
        shell: bash
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Export IPA
        working-directory: talabtek_app
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$PWD/build/ios/Runner.xcarchive" \
            -exportPath "$PWD/build/ios/export" \
            -exportOptionsPlist "$PWD/ExportOptions.plist"

      - name: Verify exported IPA
        working-directory: talabtek_app
        shell: bash
        run: |
          set -euo pipefail
          IPA=$(find build/ios/export -maxdepth 1 -name '*.ipa' -print -quit)
          if [ -z "$IPA" ]; then
            echo "::error::No IPA was exported."
            exit 1
          fi

          TMP="$RUNNER_TEMP/ipa-check"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          ditto -x -k "$IPA" "$TMP"

          APP="$TMP/Payload/Runner.app"
          if [ ! -f "$APP/embedded.mobileprovision" ]; then
            echo "::error::embedded.mobileprovision is missing from the exported IPA."
            exit 1
          fi

          ACTUAL_BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          if [ "$ACTUAL_BUNDLE" != "$BUNDLE_ID" ]; then
            echo "::error::Bundle ID mismatch: $ACTUAL_BUNDLE"
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "IPA verification passed: $IPA"

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: talabtek-ios-signed
          path: talabtek_app/build/ios/export/*.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Cleanup signing keychain
        if: always()
        shell: bash
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
