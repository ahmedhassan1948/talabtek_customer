name: iOS Release

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  APP_DIR: ./talabtek_app

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ===== ضع هنا خطوات الشهادات والـ provisioning profile الموجودة عندك =====
      # (استيراد الشهادة، تثبيت البروفايل، ... إلخ) بدون أي تغيير
      # ===========================================================================
      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.1.app
          xcodebuild -version

      - name: Pod install and patch gRPC
        working-directory: ./talabtek_app/ios
        run: |
          pod install
          F=Pods/gRPC-C++/src/core/lib/promise/detail/basic_seq.h
          echo "---- before ----"
          sed -n '98,106p' $F
          sed -i '' 's/template CallSeqFactory/CallSeqFactory/g' $F
          echo "---- after ----"
          sed -n '98,106p' $F
          grep -n "template" $F || true

      - name: Build IPA
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter build ipa --release \
            --export-options-plist=ios/ExportOptions.plist \
            --build-number=17

      # ===== ضع هنا خطوة رفع الـ IPA (TestFlight / artifact) إن كانت موجودة =====
