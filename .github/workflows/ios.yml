name: iOS Release
on:
  workflow_dispatch:

env:
  BUNDLE_ID: com.your.bundleid        # غيّره لمعرّف تطبيقك الحقيقي
  PROFILE_NAME: talabtkappstore       # اسم الـ profile كما يظهر في بوابة Apple
  APP_DIR: talabtek_app

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate iOS platform if missing
        working-directory: ${{ env.APP_DIR }}
        run: |
          if [ ! -d ios ]; then
            flutter create --platforms=ios .
          fi

      - name: Firebase config
        working-directory: ${{ env.APP_DIR }}
        run: |
          mkdir -p ios/Runner
          echo -n "${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}" | base64 --decode > ios/Runner/GoogleService-Info.plist

      - name: Install certificate and profile
        env:
          P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app.keychain-db
          echo -n "$P12_BASE64" | base64 --decode -o $RUNNER_TEMP/cert.p12
          echo -n "$PROFILE_BASE64" | base64 --decode -o $RUNNER_TEMP/profile.mobileprovision

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $RUNNER_TEMP/cert.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $RUNNER_TEMP/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Configure Xcode signing
        working-directory: ${{ env.APP_DIR }}
        run: |
          PBX=ios/Runner.xcodeproj/project.pbxproj
          sed -i '' "/RunnerTests/!s/PRODUCT_BUNDLE_IDENTIFIER = .*;/PRODUCT_BUNDLE_IDENTIFIER = ${BUNDLE_ID};/" $PBX
          sed -i '' "s/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual; DEVELOPMENT_TEAM = ${{ secrets.APPLE_TEAM_ID }}; PROVISIONING_PROFILE_SPECIFIER = \"${PROFILE_NAME}\"; CODE_SIGN_IDENTITY = \"Apple Distribution\";/" $PBX
          grep -n "CODE_SIGN_STYLE\|PRODUCT_BUNDLE_IDENTIFIER" $PBX

      - name: Create ExportOptions.plist
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Build IPA
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter pub get
          flutter build ipa --release \
            --build-number=$((${{ github.run_number }} + 100)) \
            --export-options-plist=$RUNNER_TEMP/ExportOptions.plist

      - name: Upload to App Store Connect
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$KEY_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8
          xcrun altool --upload-app -f $GITHUB_WORKSPACE/${{ env.APP_DIR }}/build/ios/ipa/*.ipa -t ios \
            --apiKey $KEY_ID --apiIssuer $ISSUER_ID
