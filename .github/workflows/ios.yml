
name: iOS Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build and Sign iOS
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
      CERTIFICATE_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
      CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
      PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate signing secrets
        shell: bash
        run: |
          set -euo pipefail

          for name in TEAM_ID BUNDLE_ID CERTIFICATE_BASE64 CERTIFICATE_PASSWORD PROFILE_BASE64 KEYCHAIN_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub secret: $name"
              exit 1
            fi
          done

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Get dependencies
        working-directory: talabtek_app
        run: flutter pub get

      - name: Patch Firebase headers
        working-directory: talabtek_app
        run: python3 tool/patch_firebase_headers.py

      - name: Install CocoaPods
        working-directory: talabtek_app/ios
        run: pod install --repo-update

      - name: Patch gRPC template compatibility
        working-directory: talabtek_app/ios
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path("Pods/gRPC-C++/src/core/lib/promise/detail/basic_seq.h"),
              Path("Pods/gRPC-Core/src/core/lib/promise/detail/basic_seq.h"),
          ]

          old = "Traits::template CallSeqFactory("
          new = "Traits::CallSeqFactory("
          patched = False

          for path in paths:
              if not path.is_file():
                  print(f"Not present: {path}")
                  continue

              path.chmod(path.stat().st_mode | 0o200)
              content = path.read_text()

              if old in content:
                  path.write_text(content.replace(old, new))
                  print(f"Patched: {path}")
                  patched = True
              else:
                  print(f"No matching template found: {path}")

          if not patched:
              print("No gRPC template changes were needed.")
          PY

      - name: Prepare Flutter iOS build
        working-directory: talabtek_app
        run: flutter build ios --release --no-codesign

      - name: Install Apple signing certificate and profile
        shell: bash
        run: |
          set -euo pipefail

          CERT_PATH="$RUNNER_TEMP/distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/talabtek-signing.keychain-db"

          printf '%s' "$CERTIFICATE_BASE64" | base64 -D > "$CERT_PATH"
          printf '%s' "$PROFILE_BASE64" | base64 -D > "$PROFILE_PATH"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychains -d user -s \
            "$KEYCHAIN_PATH" \
            "$(security list-keychains -d user | tr -d '"')"

          security default-keychain -d user -s "$KEYCHAIN_PATH"

          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"

          PROFILE_UUID=$(/usr/libexec/PlistBuddy \
            -c 'Print UUID' "$PROFILE_PLIST")

          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy \
            -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")

          echo "Provisioning profile UUID: $PROFILE_UUID"
          echo "Provisioning profile application ID: $PROFILE_APP_ID"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

          case "$PROFILE_APP_ID" in
            *.*)
              PROFILE_BUNDLE="${PROFILE_APP_ID#*.}"
              ;;
            *)
              echo "::error::Invalid provisioning profile application identifier"
              exit 1
              ;;
          esac

          if [ "$PROFILE_BUNDLE" != "$BUNDLE_ID" ] && \
             [ "$PROFILE_BUNDLE" != "* " ] && \
             [ "$PROFILE_BUNDLE" != "*" ]; then
            echo "::error::Provisioning profile bundle ID does not match IOS_BUNDLE_ID"
            exit 1
          fi

      - name: Verify Apple distribution identity
        shell: bash
        run: |
          set -euo pipefail

          security find-identity -v -p codesigning "$RUNNER_TEMP/talabtek-signing.keychain-db"

          if ! security find-identity -v -p codesigning "$RUNNER_TEMP/talabtek-signing.keychain-db" | grep -q 'Apple Distribution'; then
            echo "::error::No valid Apple Distribution identity found. Check IOS_CERT_P12_BASE64 and IOS_CERT_PASSWORD."
            exit 1
          fi

      - name: Archive iOS application
        working-directory: talabtek_app
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Talabtek.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            archive

      - name: Create ExportOptions.plist
        shell: bash
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_UUID}</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          EOF

          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"

      - name: Export signed IPA
        working-directory: talabtek_app
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/ios/ipa
          rm -f build/ios/ipa/*.ipa

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/Talabtek.xcarchive" \
            -exportPath "$GITHUB_WORKSPACE/talabtek_app/build/ios/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

          echo "Exported IPA files:"
          find build/ios/ipa -maxdepth 1 -name '*.ipa' -print

          IPA_COUNT=$(find build/ios/ipa -maxdepth 1 -name '*.ipa' | wc -l | tr -d ' ')

          if [ "$IPA_COUNT" -eq 0 ]; then
            echo "::error::IPA export completed without producing an IPA file."
            exit 1
          fi

      - name: Verify IPA
        working-directory: talabtek_app
        shell: bash
        run: |
          set -euo pipefail

          IPA=$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)

          echo "IPA file: $IPA"
          ls -lh "$IPA"

          mkdir -p "$RUNNER_TEMP/ipa-check"
          unzip -q "$IPA" -d "$RUNNER_TEMP/ipa-check"

          APP_PATH="$RUNNER_TEMP/ipa-check/Payload/Runner.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Runner.app not found inside the IPA."
            exit 1
          fi

          /usr/libexec/PlistBuddy \
            -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist"

          if [ ! -f "$APP_PATH/embedded.mobileprovision" ]; then
            echo "::error::Embedded provisioning profile not found in exported app."
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

          echo "IPA structure and code signature verified."

      - name: Upload Signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: talabtek-ios-signed
          path: talabtek_app/build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload Archive for Diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: talabtek-ios-build-logs
          path: |
            ${{ runner.temp }}/Talabtek.xcarchive/Info.plist
            ${{ runner.temp }}/ExportOptions.plist
          if-no-files-found: ignore
          retention-days: 3
