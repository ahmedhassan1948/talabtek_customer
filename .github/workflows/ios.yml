
name: iOS Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug - List repository structure
        run: ls -la

      - name: Check Flutter app exists
        run: ls -la talabtek_app/

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Get dependencies
        working-directory: talabtek_app
        run: flutter pub get

      - name: Install CocoaPods
        working-directory: talabtek_app/ios
        run: pod install --repo-update

      - name: Patch gRPC template compatibility
        working-directory: talabtek_app/ios
        shell: bash
        run: |
          set -euo pipefail

          FILE="Pods/gRPC-Core/src/core/lib/promise/detail/basic_seq.h"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: gRPC header not found: $FILE"
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          path = Path("Pods/gRPC-Core/src/core/lib/promise/detail/basic_seq.h")
          text = path.read_text()

          old = "Traits::template CallSeqFactory("
          new = "Traits::CallSeqFactory("

          if new in text:
              print("Compatibility patch already applied.")
          elif old in text:
              path.write_text(text.replace(old, new))
              print("Applied gRPC compatibility patch.")
          else:
              raise SystemExit(
                  "Expected template call was not found. "
                  "Inspect basic_seq.h before applying another patch."
              )
          PY

      - name: Build iOS device app
        working-directory: talabtek_app
        run: |
          flutter build ios --release --no-codesign \
            --build-name=1.0.0 \
            --build-number=1
        env:
          CODE_SIGNING_ALLOWED: "NO"
          CODE_SIGN_IDENTITY: ""
          CODE_SIGNING_REQUIRED: "NO"
          EXPANDED_CODE_SIGN_IDENTITY: ""

      - name: Upload iOS app
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-device
          path: talabtek_app/build/ios/iphoneos/Runner.app
          if-no-files-found: error
          retention-days: 7

      - name: Package IPA for reference
        working-directory: talabtek_app
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r Runner.ipa Payload
          rm -rf Payload

      - name: Upload IPA package
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-unsigned
          path: talabtek_app/Runner.ipa
          if-no-files-found: error
          retention-days: 7
