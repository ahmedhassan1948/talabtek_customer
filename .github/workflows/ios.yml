name: iOS Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./talabtek_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug - List repo structure
        run: ls -la

      - name: Debug - Check talabtek_app exists
        run: ls -la

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Install CocoaPods
        working-directory: ./ios
        run: pod install --repo-update

      - name: Build iOS (simulator - no signing needed)
        run: |
          flutter build ios --release --no-codesign \
            --build-name=1.0.0 \
            --build-number=1 \
            --target-device=simulator
        env:
          CODE_SIGNING_ALLOWED: "NO"
          CODE_SIGN_IDENTITY: ""
          CODE_SIGNING_REQUIRED: "NO"
          EXPANDED_CODE_SIGN_IDENTITY: ""

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-simulator
          path: build/ios/iphonesimulator/Runner.app
          retention-days: 7

      - name: Create IPA (optional - for device)
        run: |
          flutter build ios --release --no-codesign \
            --build-name=1.0.0 \
            --build-number=1
        env:
          CODE_SIGNING_ALLOWED: "NO"
          CODE_SIGN_IDENTITY: ""
          CODE_SIGNING_REQUIRED: "NO"
          EXPANDED_CODE_SIGN_IDENTITY: ""
        continue-on-error: true

      - name: Package IPA
        if: success()
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r Runner.ipa Payload/Runner.app
        continue-on-error: true

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: Runner.ipa
          retention-days: 7
        continue-on-error: true
