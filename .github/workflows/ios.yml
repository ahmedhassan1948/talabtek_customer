name: iOS Release

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  APP_DIR: ./talabtek_app

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ===== ضع هنا خطوات الشهادات والـ provisioning profile الموجودة عندك =====
      # (استيراد الشهادة، تثبيت البروفايل، ... إلخ) بدون أي تغيير
      # ===========================================================================

      - name: Select Xcode 26
        run: |
          ls /Applications | grep Xcode
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version

      - name: Flutter pub get
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Debug gRPC patch
        working-directory: ${{ env.APP_DIR }}/ios
        run: |
          pod install 2>&1 | grep "grpc-patch" || true
          echo "---- remaining template lines ----"
          grep -n "template" Pods/gRPC-C++/src/core/lib/promise/detail/basic_seq.h || true
          echo "---- lines 98-106 ----"
          sed -n '98,106p' Pods/gRPC-C++/src/core/lib/promise/detail/basic_seq.h

      - name: Build IPA
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter build ipa --release \
            --export-options-plist=ios/ExportOptions.plist \
            --build-number=17

      # ===== ضع هنا خطوة رفع الـ IPA (TestFlight / artifact) إن كانت موجودة =====
