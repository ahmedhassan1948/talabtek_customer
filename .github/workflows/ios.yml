
name: iOS Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build, Sign and Validate iOS
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
      IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
      IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      IOS_BUNDLE_ID: com.talabtek.customer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Verify required secrets
        shell: bash
        run: |
          set -euo pipefail

          for name in \
            APPLE_TEAM_ID \
            IOS_CERT_PASSWORD \
            IOS_CERT_P12_BASE64 \
            IOS_PROVISION_PROFILE_BASE64 \
            KEYCHAIN_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub secret: $name"
              exit 1
            fi
          done

      - name: Get Flutter dependencies
        working-directory: talabtek_app
        run: flutter pub get

      - name: Patch Firebase headers
        working-directory: talabtek_app
        run: python3 tool/patch_firebase_headers.py

      - name: Install CocoaPods
        working-directory: talabtek_app/ios
        run: pod install --repo-update

      - name: Patch gRPC template compatibility
        working-directory: talabtek_app/ios
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path("Pods/gRPC-C++/src/core/lib/promise/detail/basic_seq.h"),
              Path("Pods/gRPC-Core/src/core/lib/promise/detail/basic_seq.h"),
          ]

          old = "Traits::template CallSeqFactory("
          new = "Traits::CallSeqFactory("
          found = 0

          for path in paths:
              if not path.is_file():
                  print(f"Not present: {path}")
                  continue

              found += 1
              content = path.read_text()

              if old not in content:
                  if new in content:
                      print(f"Already patched: {path}")
                      continue

                  raise SystemExit(
                      f"Expected expression not found in {path}"
                  )

              path.chmod(path.stat().st_mode | 0o200)
              path.write_text(content.replace(old, new))
              print(f"Patched: {path}")

          if found == 0:
              raise SystemExit("No expected gRPC header files were found.")
          PY

      - name: Install Apple signing assets
        shell: bash
        run: |
          set -euo pipefail

          SIGN_DIR="$RUNNER_TEMP/ios-signing"
          mkdir -p "$SIGN_DIR"

          CERT="$SIGN_DIR/distribution.p12"
          PROFILE="$SIGN_DIR/AppStore.mobileprovision"
          PROFILE_PLIST="$SIGN_DIR/profile.plist"
          KEYCHAIN="$SIGN_DIR/signing.keychain-db"

          printf '%s' "$IOS_CERT_P12_BASE64" \
            | base64 --decode > "$CERT"

          printf '%s' "$IOS_PROVISION_PROFILE_BASE64" \
            | base64 --decode > "$PROFILE"

          # Validate the provisioning profile.
          security cms -D -i "$PROFILE" -o "$PROFILE_PLIST"

          PROFILE_UUID=$(
            /usr/libexec/PlistBuddy \
              -c 'Print :UUID' "$PROFILE_PLIST"
          )

          PROFILE_NAME=$(
            /usr/libexec/PlistBuddy \
              -c 'Print :Name' "$PROFILE_PLIST"
          )

          PROFILE_TEAM=$(
            /usr/libexec/PlistBuddy \
              -c 'Print :TeamIdentifier:0' "$PROFILE_PLIST"
          )

          PROFILE_APP_ID=$(
            /usr/libexec/PlistBuddy \
              -c 'Print :Entitlements:application-identifier' \
              "$PROFILE_PLIST"
          )

          if [ "$PROFILE_TEAM" != "$APPLE_TEAM_ID" ]; then
            echo "::error::Provisioning profile Team ID mismatch"
            exit 1
          fi

          if [ "$PROFILE_APP_ID" != "$APPLE_TEAM_ID.$IOS_BUNDLE_ID" ]; then
            echo "::error::Provisioning profile Bundle ID mismatch"
            exit 1
          fi

          # App Store profiles should not contain registered devices.
          if /usr/libexec/PlistBuddy \
            -c 'Print :ProvisionedDevices' "$PROFILE_PLIST" \
            >/dev/null 2>&1; then
            echo "::error::This profile appears to be a development/ad hoc profile, not App Store."
            exit 1
          fi

          # Create temporary signing keychain.
          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          security set-keychain-settings -lut 21600 "$KEYCHAIN"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          security import "$CERT" \
            -P "$IOS_CERT_PASSWORD" \
            -f pkcs12 \
            -t cert \
            -A \
            -k "$KEYCHAIN"

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN"

          security list-keychains -d user -s \
            "$KEYCHAIN" \
            "$HOME/Library/Keychains/login.keychain-db"

          security default-keychain -d user -s "$KEYCHAIN"

          # Ensure a valid Apple Distribution identity exists.
          IDENTITIES=$(security find-identity \
            -v -p codesigning "$KEYCHAIN")

          echo "$IDENTITIES"

          if ! echo "$IDENTITIES" | grep -q 'Apple Distribution:'; then
            echo "::error::No valid Apple Distribution certificate found"
            exit 1
          fi

          # Install provisioning profile.
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"

          cp "$PROFILE" "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"

          {
            echo "IOS_PROFILE_NAME=$PROFILE_NAME"
            echo "IOS_PROFILE_UUID=$PROFILE_UUID"
          } >> "$GITHUB_ENV"

          rm -f "$CERT"

      - name: Configure Runner code signing
        working-directory: talabtek_app/ios
        shell: bash
        run: |
          set -euo pipefail

          export IOS_BUNDLE_ID APPLE_TEAM_ID IOS_PROFILE_NAME

          ruby <<'RUBY'
          require 'xcodeproj'

          project = Xcodeproj::Project.open('Runner.xcodeproj')
          target = project.targets.find { |t| t.name == 'Runner' }

          abort 'Runner target not found' unless target

          changed = 0

          target.build_configurations.each do |config|
            settings = config.build_settings

            next unless settings['PRODUCT_BUNDLE_IDENTIFIER'] ==
                        ENV.fetch('IOS_BUNDLE_ID')

            settings['CODE_SIGN_STYLE'] = 'Manual'
            settings['DEVELOPMENT_TEAM'] = ENV.fetch('APPLE_TEAM_ID')
            settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
            settings['PROVISIONING_PROFILE_SPECIFIER'] =
              ENV.fetch('IOS_PROFILE_NAME')

            changed += 1
            puts "Signing configured for #{config.name}"
          end

          abort 'No Runner configuration matched the Bundle ID' if changed == 0

          project.save
          RUBY

      - name: Create App Store export options
        working-directory: talabtek_app
        shell: bash
        run: |
          set -euo pipefail

          export APPLE_TEAM_ID IOS_BUNDLE_ID IOS_PROFILE_NAME

          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path

          options = {
              "method": "app-store-connect",
              "destination": "export",
              "signingStyle": "manual",
              "teamID": os.environ["APPLE_TEAM_ID"],
              "provisioningProfiles": {
                  os.environ["IOS_BUNDLE_ID"]:
                      os.environ["IOS_PROFILE_NAME"]
              },
              "manageAppVersionAndBuildNumber": False,
          }

          with Path("ExportOptions.plist").open("wb") as f:
              plistlib.dump(options, f)

          print("Created ExportOptions.plist")
          PY

      - name: Build signed IPA
        working-directory: talabtek_app
        shell: bash
        run: |
          set -euo pipefail

          flutter build ipa \
            --release \
            --export-options-plist=ExportOptions.plist \
            --build-name=1.0.0 \
            --build-number="${GITHUB_RUN_NUMBER}"

      - name: Validate IPA archive and signature
        shell: bash
        run: |
          set -euo pipefail

          IPA_DIR="talabtek_app/build/ios/ipa"
          IPA_FILE=$(find "$IPA_DIR" -maxdepth 1 \
            -type f -name '*.ipa' -print -quit)

          if [ -z "$IPA_FILE" ]; then
            echo "::error::No IPA was generated"
            exit 1
          fi

          echo "Checking IPA: $IPA_FILE"
          ls -lh "$IPA_FILE"
          file "$IPA_FILE"

          # Check the ZIP structure before uploading.
          unzip -t "$IPA_FILE"

          VERIFY_DIR="$RUNNER_TEMP/ipa-verify"
          mkdir -p "$VERIFY_DIR"
          unzip -q "$IPA_FILE" -d "$VERIFY_DIR"

          APP="$VERIFY_DIR/Payload/Runner.app"

          if [ ! -d "$APP" ]; then
            echo "::error::Payload/Runner.app is missing"
            exit 1
          fi

          if [ ! -s "$APP/embedded.mobileprovision" ]; then
            echo "::error::embedded.mobileprovision is missing"
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$APP"

          echo "IPA archive, embedded profile, and app signature verified."

      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: talabtek-ios-signed-ipa
          path: talabtek_app/build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Cleanup signing keychain
        if: always()
        shell: bash
        run: |
          KEYCHAIN="$RUNNER_TEMP/ios-signing/signing.keychain-db"

          if [ -f "$KEYCHAIN" ]; then
            security delete-keychain "$KEYCHAIN" || true
          fi
