name: iOS Build and Upload

on:
  push:
    branches:
      - main # أو اسم الفرع الرئيسي لديك

jobs:
  build-and-upload:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. إعداد فلاتر
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      # 2. تنظيف وجلب التبعيات من داخل مجلد التطبيق talabtek_customer
      - name: Clean project
        working-directory: talabtek_customer
        run: flutter clean

      - name: Get dependencies
        working-directory: talabtek_customer
        run: flutter pub get

      # 3. إعداد الـ Keychain المؤقت للتوقيع
      - name: Set up keychain
        run: |
          security create-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" build.keychain
          security set-keychain-settings -t 3600 -l build.keychain

      # 4. تثبيت شهادة التوزيع (Distribution Certificate)
      - name: Install Apple Certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH_P12=$(mktemp /tmp/certificate.XXXXXX.p12)
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH_P12"
          security import "$CERT_PATH_P12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k build.keychain
          security list-keychain -d user -s build.keychain
          rm -f "$CERT_PATH_P12"

      # 5. تثبيت ملف الـ Provisioning Profile
      - name: Install Apple Provisioning Profile
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PP_PATH=$(mktemp /tmp/profile.XXXXXX.mobileprovision)
          echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$PP_PATH"
          UUID=$(grep -a -A 1 '<key>UUID</key>' "$PP_PATH" | grep -oE '[-A-Za-z0-9]{36}')
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          echo "Installed Provisioning Profile UUID: $UUID"

      # 6. بناء ملف الـ IPA النظيف داخل مجلد التطبيق
      - name: Build IPA
        working-directory: talabtek_customer
        run: |
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist
