
name: iOS Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug - List repository structure
        run: ls -la

      - name: Check Flutter app exists
        run: ls -la talabtek_app/

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Get dependencies
        working-directory: talabtek_app
        run: flutter pub get

      - name: Install CocoaPods
        working-directory: talabtek_app/ios
        run: pod install --repo-update

      - name: Patch gRPC template compatibility
        working-directory: talabtek_app/ios
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path("Pods/gRPC-C++/src/core/lib/promise/detail/basic_seq.h"),
              Path("Pods/gRPC-Core/src/core/lib/promise/detail/basic_seq.h"),
          ]

          old = "Traits::template CallSeqFactory("
          new = "Traits::CallSeqFactory("
          found = 0

          for path in paths:
              if not path.is_file():
                  print(f"Not present: {path}")
                  continue

              found += 1
              path.chmod(path.stat().st_mode | 0o200)
              text = path.read_text()

              if old in text:
                  path.write_text(text.replace(old, new))
                  print(f"Patched: {path}")
              elif new in text:
                  print(f"Already patched: {path}")
              else:
                  raise SystemExit(
                      f"Expected expression not found in {path}. "
                      "Stop and inspect the file rather than guessing."
                  )

          if found == 0:
              raise SystemExit("No expected gRPC header files were found.")
          PY

      - name: Build iOS device app
        working-directory: talabtek_app
        run: |
          flutter build ios --release --no-codesign \
            --build-name=1.0.0 \
            --build-number=1
        env:
          CODE_SIGNING_ALLOWED: "NO"
          CODE_SIGN_IDENTITY: ""
          CODE_SIGNING_REQUIRED: "NO"
          EXPANDED_CODE_SIGN_IDENTITY: ""

      - name: Upload iOS app
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-device
          path: talabtek_app/build/ios/iphoneos/Runner.app
          if-no-files-found: error
          retention-days: 7

      - name: Package IPA for reference
        working-directory: talabtek_app
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r Runner.ipa Payload
          rm -rf Payload

      - name: Upload IPA package
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-unsigned
          path: talabtek_app/Runner.ipa
          if-no-files-found: error
          retention-days: 7
