name: Build Android App Bundle

on:
  push:
    branches: [ "main" ] # أو master حسب اسم الفرع لديك
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب الكود من المستودع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. إعداد بيئة جافا (مطلوبة لبناء أندرويد)
      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. إعداد بيئة فلاتر (تم إزالة working-directory من هنا لحل المشكلة)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x' # أو يمكنك تحديد الإصدار بالضبط مثل '3.19.0'
          channel: 'stable'
          cache: true

      # 4. تثبيت الحزم والمكتبات
      - name: Install dependencies
        run: flutter pub get

      # 5. بناء ملف الـ App Bundle (.aab)
      - name: Build Android App Bundle
        run: flutter build appbundle --release

      # 6. حفظ الملف الناتج للتحميل لاحقاً
      - name: Upload App Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
