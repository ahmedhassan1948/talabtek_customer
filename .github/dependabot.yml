# Dependabot Configuration
# تحديثات التبعيات التلقائية

version: 2
updates:
  # Flutter/Dart dependencies
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Riyadh"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "flutter"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      flutter-packages:
        patterns:
          - "*"
        exclude-patterns:
          - "firebase_*"
          - "google_maps_*"
      firebase-packages:
        patterns:
          - "firebase_*"
      google-maps-packages:
        patterns:
          - "google_maps_*"
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Riyadh"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Docker
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "first monday"
      time: "09:00"
      timezone: "Asia/Riyadh"
    labels:
      - "dependencies"
      - "docker"

  # npm (لـ Fastlane وأي أدوات Node.js)
  - package-ecosystem: "npm"
    directory: "/fastlane"
    schedule:
      interval: "monthly"
      day: "first monday"
      time: "09:00"
      timezone: "Asia/Riyadh"
    labels:
      - "dependencies"
      - "fastlane"
    ignore:
      - dependency-name: "*"
        update-type: "version-update:semver-major"