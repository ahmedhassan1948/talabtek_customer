plugins {
    id "com.android.application"
    id "kotlin-android"
    // يجب أن يأتي بعد إضافات Android و Kotlin
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader -> localProperties.load(reader) }
}
def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0.0'

// بيانات التوقيع: من key.properties (محلياً) أو من متغيرات البيئة (GitHub Actions)
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader -> keystoreProperties.load(reader) }
}
def ksFile = keystoreProperties['storeFile'] ?: System.getenv('KEYSTORE_FILE')

android {
    namespace "com.talabtek.customer"
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.talabtk.order"
        minSdkVersion 21
        targetSdkVersion 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    signingConfigs {
        release {
            if (ksFile) {
                storeFile rootProject.file(ksFile)
                storePassword keystoreProperties['storePassword'] ?: System.getenv('KEYSTORE_PASSWORD')
                keyAlias keystoreProperties['keyAlias'] ?: System.getenv('KEY_ALIAS')
                keyPassword keystoreProperties['keyPassword'] ?: System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            // لو لا يوجد keystore يُوقَّع بمفتاح debug حتى لا يفشل البناء
            signingConfig ksFile ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation 'androidx.multidex:multidex:2.0.1'
}
