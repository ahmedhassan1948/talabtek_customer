workflows:
  android-build:
    name: Android App Bundle
    max_build_duration: 30
    working_directory: talabtek_app
    environment:
      flutter: "3.19.0"
      java: "17"
    cache:
      cache_paths:
        - ~/.pub-cache
        - $HOME/.gradle/caches
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Build App Bundle
        script: flutter build appbundle --release --obfuscate --split-debug-info=build/app/outputs/symbols
    artifacts:
      - build/app/outputs/bundle/release/app-release.aab
      - build/app/outputs/symbols/**
    publishing:
      email:
        recipients:
          - ahmedhassan19481@gmail.com
